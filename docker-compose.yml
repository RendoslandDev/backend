version: '3.8'
services:
  backend:
    build: .
    ports:
      - "8080:8080"
    environment:
      - JWT_SECRET=${JWT_SECRET:-mECQyti5RZZ9YzIBuoOeneb1DEr/MAs65Qa7NxYyH0U=}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME:-a2192fd6bca616}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-8ed374ec34aa2a}
      - SMTP_FROM=${SMTP_FROM:-a2192fd6bca616}
      - DATABASE_URL=postgres://postgres:password@db:5432/app_db
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: app_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
